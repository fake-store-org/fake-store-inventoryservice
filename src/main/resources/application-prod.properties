spring.application.name=fs-inventory
spring.config.import=aws-parameterstore:/config/inventory/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_PUBLIC_JWT_URL:http://auth-service:8081/api/internal/auth/.well-known/jwks.json}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=${SERVER_PORT:8084}
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
app.queues.confirm-reservation=
spring.cloud.aws.region.static=eu-north-1
