spring.application.name=fs-inventory
spring.config.import=aws-parameterstore:/config/inventory/
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=${server.port:8084}
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
app.queues.confirm-reservation=
spring.cloud.aws.region.static=eu-north-1
#spring.cloud.aws.credentials.access-key=${SQS_ACCESS_KEY}
#spring.cloud.aws.credentials.secret-key=${SQS_SECRET_ACCESS_KEY}